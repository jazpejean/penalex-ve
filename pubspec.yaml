publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  animations: ^2.0.11
  audioplayers: ^5.2.1
  cloud_firestore: ^4.13.6
  confetti: ^0.7.0
  device_info_plus: ^9.0.0
  firebase_auth: ^4.16.0
  firebase_auth_web: ^5.8.13
