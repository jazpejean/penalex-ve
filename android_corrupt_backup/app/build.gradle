plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // El plugin de Flutter debe ir de último
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.penalex.ve"
    // Valores fijos para evitar errores de lectura de variables
    compileSdkVersion 36 
    ndkVersion "28.2.13676358" // Usar versión instalada completa

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.penalex.ve"
        // Configuraciones mínimas para compatibilidad con la mayoría de teléfonos en Venezuela
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

apply plugin: 'com.google.gms.google-services'
