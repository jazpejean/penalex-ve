name = "penalex-auth-bridge"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Identidad: traduce la sesión de Firebase a un JWT de Supabase.
[vars]
FIREBASE_PROJECT_ID = "penalex-ve"

# Secrets (NO van en el repo; se configuran con `wrangler secret put`):
#   SUPABASE_JWT_SECRET      — secreto de firma del JWT de Supabase
#   QDRANT_URL               — https://<cluster>.aws.cloud.qdrant.io:6333
#   QDRANT_API_KEY           — API key de Qdrant Cloud
#   CF_AI_ACCOUNT_ID         — cuenta Cloudflare para Workers AI (bge-m3)
#   CF_AI_API_KEY            — token de Workers AI (Bearer)