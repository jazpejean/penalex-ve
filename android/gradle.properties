org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=false
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
# Evita "Already watching path" en runners de CI (VFS watch de Gradle)
org.gradle.vfs.watch=false
