name: Arreglar Imágenes en R2

on:
  workflow_dispatch:  # Ejecutar manualmente desde GitHub Actions
    inputs:
      max_workers:
        description: 'Número de workers paralelos (1-20)'
        required: false
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'

jobs:
  arreglar:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 horas máximo
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install boto3 urllib3
      
      - name: Ejecutar script de corrección
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: 'penalex-assets'
          R2_PUBLIC_URL: 'https://pub-a6e0bfa2e9174e91b031ae28c0667009.r2.dev'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_WORKERS: ${{ inputs.max_workers || '10' }}
        run: |
          python arreglar_imagenes_github.py
      
      - name: Resumen del proceso
        if: always()
        run: |
          echo "✅ Workflow completado"
          echo "Revisa los logs arriba para ver estadísticas"
