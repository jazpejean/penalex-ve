name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [feature/nav-unificada, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-pub

      - name: Compilar APK (debug, con WORKER_URL/INGEST_TOKEN)
        run: >
          flutter build apk --debug
          --dart-define=WORKER_URL=${{ secrets.WORKER_URL }}
          --dart-define=INGEST_TOKEN=${{ secrets.INGEST_TOKEN }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: penalex-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Verificar APK generado
        run: ls -la build/app/outputs/flutter-apk/