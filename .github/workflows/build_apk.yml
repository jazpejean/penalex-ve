name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [feature/nav-unificada, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      # Override del heap de Gradle para CI (la máquina local usa -Xmx1536M, el runner tiene 7GB)
      ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx4G -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
      ORG_GRADLE_PROJECT_org.gradle.workers.max: "4"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      - name: "Parchear edge_detection (AGP 8: quitar package= del manifest)"
        run: |
          MANIFEST="$HOME/.pub-cache/hosted/pub.dev/edge_detection-1.1.3/android/src/main/AndroidManifest.xml"
          sed -i 's/ package="com.sample.edgedetection"//' "$MANIFEST"
          echo "manifest parcheado:"
          head -2 "$MANIFEST"

      - name: "Parchear google_mlkit_commons (compileSdk 29→36: resource android:attr/lStar not found)"
        run: |
          GRADLE_FILE="$HOME/.pub-cache/hosted/pub.dev/google_mlkit_commons-0.6.1/android/build.gradle"
          sed -i 's/compileSdkVersion 29/compileSdkVersion 36/' "$GRADLE_FILE"
          echo "compileSdk parcheado:"
          grep "compileSdkVersion" "$GRADLE_FILE"

      - name: Generar .env desde secrets (necesario para analyze y build)
        run: |
          cat > .env <<'ENVEOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_API_KEY_WEB=${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          ENVEOF
          echo ".env generado ($(wc -l < .env) líneas)"

      - name: Restaurar keystore de release desde secrets
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/penalex-release.jks
          ls -la android/app/keystore/
          echo "KEYSTORE_FILE=$(pwd)/android/app/keystore/penalex-release.jks" >> "$GITHUB_ENV"

      - name: Caché Gradle/NDK (acelera builds; evita re-descargar NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            ${{ runner.temp }}/ndk
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Análisis estático
        run: flutter analyze --no-pub

      - name: Tests del motor de lapsos (Calendario Judicial)
        run: flutter test test/lapsos_engine_test.dart --no-pub

      - name: Diagnóstico de espacio antes de compilar
        run: df -h / | tail -1 && du -sh ~/.gradle ~/.pub-cache 2>/dev/null | tail -2

      - name: Compilar APK (release firmado, con WORKER_URL/INGEST_TOKEN)
        id: build
        run: >
          flutter build apk --release
          --dart-define=WORKER_URL=${{ secrets.WORKER_URL }}
          --dart-define=INGEST_TOKEN=${{ secrets.INGEST_TOKEN }}

      - name: Diagnóstico (stacktrace si packageRelease falla)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          cd android
          ./gradlew :app:packageRelease --stacktrace -x lint 2>&1 | tail -60 || true

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: penalex-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Verificar APK generado
        run: ls -la build/app/outputs/flutter-apk/