name: Sincronizar manifest de leyes

# Mantiene manifest.json del bucket `leyes` al día con Supabase Storage como
# fuente de verdad: cada 4 horas (y manualmente) valida la estructura de los
# JSON subidos y regenera el manifest. No depende de la carpeta local tool/.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar y regenerar manifest desde el bucket
        run: node registrar_leyes_supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}