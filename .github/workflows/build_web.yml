name: Build y Deploy Web (penalexve.com)

# Compila la web Next.js (output export) en un runner de GitHub y la despliega
# en Cloudflare Pages. Así el build pesado no corre en la máquina local.
on:
  workflow_dispatch:  # Ejecutar manualmente desde GitHub Actions
  push:
    branches: [main, feature/nav-unificada]
    paths:
      - 'penalex-web/**'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: penalex-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: penalex-web

      - name: Generar .env.local desde secrets
        run: |
          cat > .env.local << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
        working-directory: penalex-web

      - name: Build (output export)
        run: CI=1 ./node_modules/.bin/next build --webpack
        working-directory: penalex-web

      - name: Deploy a Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=penalex-web --branch=main
        working-directory: penalex-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}