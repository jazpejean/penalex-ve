name: Scrape TSJ

on:
  workflow_dispatch:
    inputs:
      anio_start:
        description: 'Año inicio'
        type: string
        default: '2000'
      anio_end:
        description: 'Año fin'
        type: string
        default: '2026'
  schedule:
    - cron: '0 4 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - name: Restaurar progreso
        uses: actions/cache/restore@v3
        with:
          path: progreso_scraping.json
          key: tsj-progreso-v1
          restore-keys: tsj-progreso-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          playwright install chromium
          playwright install-deps chromium
      
      - name: Ejecutar Scraper
        env:
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://penalex-scraper.ignaciojazpe47.workers.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN || '37c112d5ce886b13f394610f49aed5de' }}
        run: |
          python scraper_tsj.py ${{ inputs.anio_start || '2000' }} ${{ inputs.anio_end || '2026' }}
      
      - name: Guardar progreso
        uses: actions/cache/save@v3
        with:
          path: progreso_scraping.json
          key: tsj-progreso-v1-${{ github.run_id }}
      
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: tsj-scraped-data
          path: ./scraped_tsJ/
          retention-days: 90
