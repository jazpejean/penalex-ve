name: Procesar y Publicar Sentencias TSJ

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Número de archivos a procesar (0 = todos)'
        required: false
        default: '0'
      lote:
        description: 'Publicar cada N archivos (ej: 1, 5, 10)'
        required: false
        default: '10'

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Cambiamos a 3.11 para evitar warning

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          npm install -g firebase-tools

      # ----- AUTENTICACIÓN CON GOOGLE DRIVE (método seguro) -----
      - name: Crear credenciales desde secret
        env:
          CREDS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          # Escribir el contenido del secret en un archivo, asegurando que sea exacto
          echo "${CREDS_JSON}" > /tmp/creds.json
          # Validar que sea un JSON válido
          python -c "import json; f=open('/tmp/creds.json'); json.load(f); f.close(); print('✅ JSON válido')" || exit 1
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/creds.json" >> $GITHUB_ENV

      - name: Cache progreso
        uses: actions/cache@v3
        with:
          path: /content/progreso.json
          key: progreso-${{ github.run_id }}
          restore-keys: |
            progreso-

      - name: Ejecutar script
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          LIMITE: ${{ github.event.inputs.limite || '0' }}
          LOTE: ${{ github.event.inputs.lote || '10' }}
        run: python script.py
