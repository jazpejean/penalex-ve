name: Procesar y Publicar TSJ

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Archivos a procesar (0 = todos)'
        required: false
        default: '0'
      lote:
        description: 'Publicar cada N archivos'
        required: false
        default: '5000'

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar wkhtmltopdf y firebase-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wkhtmltopdf
          npm install -g firebase-tools

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Configurar credenciales de Google
        run: |
          cat > /tmp/creds.json << 'JSONEOF'
          ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          JSONEOF
          sed -i 's/^[[:space:]]*//' /tmp/creds.json
          echo "Primer caracter: '$(head -c 1 /tmp/creds.json)'"
          python3 -c "
          import json,sys
          try:
              d=json.load(open('/tmp/creds.json'))
              print('✅ JSON válido | proyecto:', d.get('project_id'))
          except Exception as e:
              print('❌ JSON inválido:', e); sys.exit(1)
          "
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/creds.json" >> $GITHUB_ENV

      - name: Ejecutar pipeline
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          LIMITE: ${{ github.event.inputs.limite || '0' }}
          LOTE: ${{ github.event.inputs.lote || '5000' }}
        run: python -u script.py
