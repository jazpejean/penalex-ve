name: Procesar y Publicar Sentencias TSJ

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Número de archivos a procesar (0 = todos)'
        required: false
        default: '0'
      lote:
        description: 'Publicar cada N archivos (ej: 1, 5, 10)'
        required: false
        default: '10'

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          npm install -g firebase-tools

      - name: Configurar credenciales de Google
        run: |
          # Usar printf para preservar el formato exacto del JSON
          printf '%s' "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > /tmp/creds.json
          
          # Validar que el JSON sea válido
          python -c "
          import json
          import sys
          
          try:
              with open('/tmp/creds.json', 'r') as f:
                  data = json.load(f)
              print('✅ JSON válido')
              print(f'   Tipo: {data.get(\"type\", \"desconocido\")}')
              print(f'   Proyecto: {data.get(\"project_id\", \"desconocido\")}')
          except json.JSONDecodeError as e:
              print(f'❌ JSON inválido: {e}')
              print('Contenido del archivo (primeros 200 chars):')
              with open('/tmp/creds.json', 'r') as f:
                  print(f.read()[:200])
              sys.exit(1)
          except Exception as e:
              print(f'❌ Error inesperado: {e}')
              sys.exit(1)
          "
          
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/creds.json" >> $GITHUB_ENV

      - name: Cache progreso
        uses: actions/cache@v3
        with:
          path: /content/progreso.json
          key: progreso-${{ github.run_id }}
          restore-keys: |
            progreso-

      - name: Ejecutar script
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          LIMITE: ${{ github.event.inputs.limite || '0' }}
          LOTE: ${{ github.event.inputs.lote || '10' }}
        run: python script.py
