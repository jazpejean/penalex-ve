name: Sincronizar URLs R2 → Supabase

on:
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install boto3 requests python-dotenv

      - name: Sincronizar URLs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: 'penalex-ve'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sincronizar_urls.py

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-sincronizacion
          path: |
            indice_completo.csv
            faltantes_en_r2.csv
            faltantes_en_supabase.csv
            reporte_sincronizacion.txt
          if-no-files-found: ignore

      - name: Resumen
        if: always()
        run: |
          if [ -f reporte_sincronizacion.txt ]; then
            cat reporte_sincronizacion.txt
          fi
