# Configuración de análisis de Flutter
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Deshabilitar reglas de info no críticas
    avoid_redundant_argument_values: false
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
    sort_constructors_first: false
    always_put_required_named_parameters_first: false
    directives_ordering: false
    unnecessary_await_in_return: false
    unnecessary_lambdas: false
    unnecessary_brace_in_string_interps: false
    unnecessary_string_interpolations: false
    unnecessary_parenthesis: false
    avoid_catches_without_on_clauses: false
    diagnostic_describe_all_properties: false
    leading_newlines_in_multiline_strings: false
    use_full_hex_values_for_flutter_colors: false
    avoid_positional_boolean_parameters: false
    avoid_slow_async_io: false
    flutter_style_todos: false
    
    # Mantener reglas importantes
    avoid_print: true
    prefer_final_fields: true
    prefer_final_locals: false
    prefer_final_in_for_each: false
    prefer_single_quotes: false
    unawaited_futures: false  # Temporal
    
analyzer:
  errors:
    # Degradar algunos errores a warnings
    deprecated_member_use: ignore  # Cambiado de warning a ignore
    
    # Ignorar errores de paquetes externos con problemas
    non_type_as_type_argument: ignore
    undefined_getter: ignore
    undefined_class: ignore
    undefined_named_parameter: ignore
    missing_required_argument: ignore
    extra_positional_arguments_could_be_named: ignore
    unnecessary_null_comparison: ignore
    
    # Ignorar algunos info
    unused_import: info
    unused_element: info
    unused_field: info
    dead_code: warning
    use_build_context_synchronously: ignore
    prefer_final_fields: ignore
    sort_child_properties_last: ignore
    
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/document_scanner_service_pro.dart"  # Problemas con paquete edge_detection
    - "**/image_filter_service.dart"  # Problemas con paquete image
    - "**/crop_adjust_screen.dart"  # Problemas con paquete image
