name = "penalex-quiz-generador"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Workers AI: motor principal (cuota gratuita diaria de 10.000 neuronas).
[ai]
binding = "AI"

# Sentencias (R2) — buckets verificados vía API de Cloudflare:
#  - penalex-ve-v2: scrapeo NUEVO (html/scon/...) → primario.
#  - penalex-ve:    scrapeo anterior (html/jurisprudencias/...) → respaldo.
[[r2_buckets]]
binding = "SENTENCIAS"
bucket_name = "penalex-ve-v2"

[[r2_buckets]]
binding = "SENTENCIAS_ANTERIORES"
bucket_name = "penalex-ve"

# Generación proactiva diaria (03:00 UTC): el banco se auto-repone.
[triggers]
crons = ["0 3 * * *"]

# Modelos de Workers AI (se prueban en orden; el segundo es respaldo).
[vars]
AI_MODEL = "@cf/qwen/qwen2.5-72b-instruct"
AI_MODEL_FALLBACK = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"